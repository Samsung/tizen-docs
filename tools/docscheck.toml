# Configuration for tools/check_docs.py
#
# One place decides what is exempt from what. Scattering exclusions across
# several tools' own ignore files is how these setups rot, so third-party
# ignore files are generated from here rather than hand-maintained:
#
#     python3 tools/check_docs.py export-ignores --tool markdownlint
#
# Run `python3 tools/check_docs.py doctor` after editing. It reports patterns
# that no longer match anything and severities naming a rule that does not
# exist, which is the failure mode this file is prone to: docs/menu.yaml was
# deleted upstream and a rule that validated it became dead weight.

schema = 1

# ---------------------------------------------------------------------------
# Path classes.
#
# classify() takes the FIRST match, so order is meaningful: a hand-written
# document that happens to live under an api/ directory must appear before the
# generated class that would otherwise swallow it.
# ---------------------------------------------------------------------------

[[classes]]
id = "api-handwritten"
match = [
  "docs/application/web/api/index.md",
  # Hand-authored in #2369 despite sitting beside generated API pages. There is
  # no generator for it anywhere in the repository.
  "docs/extensions/tizenx/api/toc.md",
]
reason = """These live under an api/ directory but are hand-written pages, not
imported output. They get the full set of checks."""

[[classes]]
id = "published-elsewhere"
match = [
  # docs/application/dotnet/api/ is not in this checkout at all - the .NET API
  # reference is published from the TizenFX repository - yet ~1230 links point
  # into it. Marked "?" for that reason, not because it is stale.
  "?docs/application/dotnet/api/**",
  # The tizen.dev URL shape. No link uses it today; kept so that reintroducing
  # one does not produce a wave of false positives.
  "?docs/**/api/[0-9]*.[0-9]*/**",
]
link_policy = "exempt-existence"
reason = """API routes served by a separate pipeline, so no file exists in this
checkout and a link to one cannot be verified here.

Deliberately narrow. `latest` is a committed symlink, so paths beneath
docs/application/native/api/*/latest/ do resolve and are checked - exempting
that shape as well used to hide thirteen real defects, one of them a directory
misspelt with three m's."""

[[classes]]
id = "generated"
match = [
  "docs/**/api/**",
  # Guards, marked "?" because they may match nothing today without being
  # stale: AGENTS.md names both as imported content, and it should already be
  # exempt on the day it reappears rather than after someone edits it by hand.
  "?docs/**/wiki/**",
  "?docs/**/*.autogen.md",
]
skip_rules = ["N-*", "D-*", "T-ORPHAN"]
# One defect in a generator becomes hundreds of findings in its output, and
# hundreds of findings are only ever a reason to stop reading the report.
aggregate_rules = ["T-META"]
reason = """Imported from another pipeline. Correct the upstream source and
re-import; editing the output here is lost on the next import."""

# ---------------------------------------------------------------------------
# Directory names that predate N-KEBAB-DIR and stay.
#
# The rule holds *new* directories to lowercase kebab-case. Its check walks
# every path component of an added file, though, so without this list adding
# any file to one of these directories reports the directory - which is not
# something the change can fix and not what the rule is for.
#
# Renaming them is off the table: HAL and NUI are the names people use, and a
# rename would break every inbound link for a cosmetic gain. `doctor` reports
# an entry here that no longer names a real directory, so the list cannot rot
# into misleading text.
#
# New directories are still held to the rule: a name absent from this list is
# reported as before.
# ---------------------------------------------------------------------------

[naming]
legacy_directories = [
  # Acronyms and product names, deliberately kept as written.
  "HAL",
  "NUIsetup",
  "Tizen",
  "codeExamples",
  # Snake_case predating the rule, under the generated web API trees.
  "device_api",
  "ui_fw_api",
  "w3c_api",
]

# ---------------------------------------------------------------------------
# Rule severities. ERROR fails the run; WARN must be fixed or explained in
# review; NOTE is advisory only. Globs are allowed, most specific first.
# ---------------------------------------------------------------------------

[rules]
"N-KEBAB" = "error"
"D-H1" = "error"
"T-ORPHAN" = "error"
"L-BROKEN" = "error"
"L-ANCHOR" = "error"
"L-ANCHOR-AMBIG" = "warn"

# Sub-diagnoses of a broken reference. Separate ids because each names a
# different mistake and three of them can name the correction too, which is
# what turns a finding into a one-click fix.
"L-HTML" = "error"
"L-DEPTH" = "error"
"L-CASE" = "error"
"L-DOCSPREFIX" = "error"

# Reverse-direction rules. ERROR from the start and they add no backlog: they
# are scoped to the paths a change removes, so a change that removes nothing
# reports nothing.
"R-INBOUND" = "error"
"R-TOC" = "error"

# Navigation. Heading depth in a toc*.md *is* navigation depth, so a skipped
# level loses a node; both of these read zero today and are gated to keep it.
"T-DANGLING" = "error"
"T-DEPTH" = "error"
"T-META-SRC" = "error"

"T-META" = "warn"

"T-XML" = "error"
"T-XMLVER" = "error"
"M-ALT" = "error"
"M-ORPHAN" = "warn"
"D-FM" = "warn"
"N-KEBAB-DIR" = "error"

# A baseline entry that no longer reproduces, which is how a regression hides.
"B-STALE" = "error"

# Content advisories from reviewguide/review_points_guide.md. Both are narrow
# in scope on purpose; see [scope] below.
"D-OVERVIEW" = "warn"
"L-FEATPRIV" = "warn"
"R-MEDIA" = "warn"
"R-ANCHOR" = "warn"

# ---------------------------------------------------------------------------
# Rule scope. "added-only" means the rule is applied to files a change adds,
# and stays silent otherwise. It is for requirements that are right for new
# content but whose legacy violation count can never reach zero.
# ---------------------------------------------------------------------------

[scope]
# 22 existing directories do not conform - platform/HAL/, vstools/Tizen/,
# nui/NUIsetup/ and so on. Renaming them would break dozens of links for a
# cosmetic gain, so only new directories are held to the rule.
"N-KEBAB-DIR" = "added-only"

# Two thirds of existing pages are not linked from their section landing page,
# and reaching a page through the TOC alone is legitimate. The value of this
# rule is the reminder while a page is being written, not a corpus audit.
"D-OVERVIEW" = "added-only"

# 219 keys in the corpus are hyperlinked, but 143 of those are in
# platform/release-notes/tizen-2-*.md - historical records that should not be
# rewritten - and 65 more are in the features/ reference tables. Scoped to
# changed files, the rule fixes a line when someone is already editing it.
"L-FEATPRIV" = "changed-only"

# ---------------------------------------------------------------------------
# Publication ownership.
#
# ``toc_all.md`` is not automatically a publishing TOC. In particular the SDK
# Tools copy jobs consume the six model/IDE TOCs below; its toc_all.md is IA
# source material and cannot make a page reachable on tizen.dev. Keep a
# section here whenever a publisher section is introduced.
# ---------------------------------------------------------------------------

[publication]
automatic_landings = []

[[publication.sections]]
id = "application-flutter"
match = ["docs/application/flutter/**"]
governing_tocs = ["docs/application/flutter/toc.md"]
recommended_section = "Application / Flutter"

[[publication.sections]]
id = "application"
match = ["docs/application/**"]
governing_tocs = ["docs/application/toc_all.md"]
recommended_section = "Application"

[[publication.sections]]
id = "extensions-tizenx"
match = ["docs/extensions/tizenx/**"]
governing_tocs = ["docs/extensions/tizenx/guides/toc.md"]
recommended_section = "Extensions / TizenX"

[[publication.sections]]
id = "sdk-tools"
match = ["docs/sdk-tools/**"]
governing_tocs = [
  "docs/sdk-tools/toc_vscode_dotnet.md",
  "docs/sdk-tools/toc_vscode_native.md",
  "docs/sdk-tools/toc_vscode_web.md",
  "docs/sdk-tools/toc_vs-ext_dotnet.md",
  "docs/sdk-tools/toc_vs-ext_native.md",
  "docs/sdk-tools/toc_vs-ext_web.md",
]
recommended_section = "SDK Tools (select the applicable model and IDE TOC)"

[[publication.sections]]
id = "platform-hal"
match = ["docs/platform/HAL/**"]
governing_tocs = ["docs/platform/HAL/toc.md"]
recommended_section = "Platform / HAL"

[[publication.sections]]
id = "tizen-platform-overview"
match = ["docs/platform/what-is-tizen/**"]
governing_tocs = ["docs/platform/what-is-tizen/toc.md"]
recommended_section = "Platform / Tizen Platform / Overview"

[[publication.sections]]
id = "tizen-platform-get-started"
match = ["docs/platform/get-started/**"]
governing_tocs = ["docs/platform/get-started/toc.md"]
recommended_section = "Platform / Tizen Platform / Get Started"

[[publication.sections]]
id = "tizen-platform-developing"
match = ["docs/platform/developing/**"]
governing_tocs = ["docs/platform/developing/toc.md"]
recommended_section = "Platform / Tizen Platform / Guides / Developing"

[[publication.sections]]
id = "tizen-platform-compliance"
match = ["docs/platform/compliance/**"]
governing_tocs = ["docs/platform/compliance/toc.md"]
recommended_section = "Platform / Tizen Platform / Guides / Compliance"

[[publication.sections]]
id = "tizen-platform-porting"
match = ["docs/platform/porting/**"]
governing_tocs = ["docs/platform/porting/toc.md"]
recommended_section = "Platform / Tizen Platform / Guides / Porting"

[[publication.sections]]
id = "tizen-platform-reference"
match = ["docs/platform/reference/**"]
governing_tocs = ["docs/platform/reference/toc.md"]
recommended_section = "Platform / Tizen Platform / Reference"

[[publication.sections]]
id = "tizen-platform-release-notes"
match = ["docs/platform/release-notes/**"]
governing_tocs = ["docs/platform/release-notes/toc.md"]
recommended_section = "Platform / Tizen Platform / Release Notes"

[[publication.sections]]
id = "shared-trademarks"
match = ["docs/trademarks.md"]
